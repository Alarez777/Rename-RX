[workspace]
resolver = "2"
members = ["crates/rename-rx", "crates/rename-rx-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Alarez777"]
repository = "https://github.com/Alarez777/rename-rx"

[workspace.dependencies]
chrono = "0.4"
dark-light = "3.0"
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
egui = "0.37"
egui_extras = "0.37"
rename-rx-core = { path = "crates/rename-rx-core" }
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
