[workspace]
resolver = "2"
members = ["crates/rename-rx", "crates/rename-rx-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Alarez777"]
repository = "https://github.com/Alarez777/rename-rx"

[workspace.dependencies]
dark-light = "3.0"
eframe = "0.37"
egui = "0.37"
rename-rx-core = { path = "crates/rename-rx-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
